name: Forge C++20 host per-message mailbox ticket model
on:
  pull_request:
    paths: ['include/atto/proxy_receipt_gate_v1.hpp', 'include/atto/proxy_mailbox_ticket_v1.hpp', 'tests/proxy_receipt_gate_v1.cpp', 'tests/proxy_mailbox_ticket_v1.cpp', '.github/workflows/proxy-ticket-host-gate.yml']
  push:
    paths: ['include/atto/proxy_receipt_gate_v1.hpp', 'include/atto/proxy_mailbox_ticket_v1.hpp', 'tests/proxy_receipt_gate_v1.cpp', 'tests/proxy_mailbox_ticket_v1.cpp', '.github/workflows/proxy-ticket-host-gate.yml']
permissions:
  contents: read
jobs:
  host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Execute host gate and per-mail ticket stress
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.compiler }}" -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -pthread -I include             tests/proxy_receipt_gate_v1.cpp -o /tmp/forge-receipt-gate
          timeout 45 /tmp/forge-receipt-gate
          "${{ matrix.compiler }}" -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -pthread -I include             tests/proxy_mailbox_ticket_v1.cpp -o /tmp/forge-mailbox-tickets
          timeout 45 /tmp/forge-mailbox-tickets | tee /tmp/forge-ticket.out
          grep -Fx 'ATTO_FORGE_HOST_PER_MAIL_TICKETS_128_CONCURRENT=PASS' /tmp/forge-ticket.out
      - run: echo 'HOST_ONLY, no compiled .atto guest, production IPC, authenticated capability or real Forge scheduler integration.'
