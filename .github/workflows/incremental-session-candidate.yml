name: Incremental compiler session candidate
on:
  pull_request:
    paths:
      - 'compiler/frontend.hpp'
      - 'compiler/frontend.cpp'
      - 'tests/incremental_session.cpp'
      - 'tests/persistent_assembly.cpp'
      - 'compiler/persistent_assembly.hpp'
      - 'compiler/persistent_assembly.cpp'
      - 'tests/persistent_assembly_api.cpp'
      - 'compiler/cache_envelope.hpp'
      - 'compiler/cache_envelope.cpp'
      - 'tests/compiler_cache_envelope.cpp'
      - '.github/workflows/incremental-session-candidate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute real compiler candidate
        run: |
          set -eu
          c++ -std=c++20 -I. compiler/frontend.cpp compiler/ir.cpp codegen/native.cpp tests/incremental_session.cpp -o /tmp/atto-forge-session
          /tmp/atto-forge-session /tmp/atto-forge-cold.s /tmp/atto-forge-edit.s
          printf '%s\n' '#include <stdint.h>' 'extern int64_t oresforge_entry(int64_t);' 'int main(void){return (int)oresforge_entry(41);}' > /tmp/atto-forge-host.c
          for name in cold edit; do
            cc /tmp/atto-forge-host.c /tmp/atto-forge-$name.s -o /tmp/atto-forge-$name
            rc=0; /tmp/atto-forge-$name || rc=$?
            if [ "$name" = cold ]; then test "$rc" = 42; else test "$rc" = 43; fi
          done
          echo INCREMENTAL_FORGE_NATIVE_42_43
          c++ -std=c++20 -I. compiler/frontend.cpp compiler/ir.cpp codegen/native.cpp compiler/cache_envelope.cpp tests/compiler_cache_envelope.cpp -lcrypto -o /tmp/atto-forge-envelope
          /tmp/atto-forge-envelope
          c++ -std=c++20 -I. compiler/frontend.cpp compiler/ir.cpp codegen/native.cpp compiler/cache_envelope.cpp tests/persistent_assembly.cpp -lcrypto -o /tmp/atto-forge-persistent
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          compiler="$(sha256sum /tmp/atto-forge-persistent | cut -d' ' -f1)"
          for lane in cold warm edit; do
            /tmp/atto-forge-persistent "$work" "$lane" "$compiler" "$work/$lane.s"
            cc /tmp/atto-forge-host.c "$work/$lane.s" -o "$work/$lane"
            rc=0; "$work/$lane" || rc=$?
            if [ "$lane" = edit ]; then test "$rc" = 43; else test "$rc" = 42; fi
            echo "PERSISTENT_FORGE_NATIVE|$lane|$rc"
          done
          cmp "$work/cold.s" "$work/warm.s"
          c++ -std=c++20 -I. compiler/frontend.cpp compiler/ir.cpp codegen/native.cpp compiler/cache_envelope.cpp compiler/persistent_assembly.cpp tests/persistent_assembly_api.cpp -lcrypto -o /tmp/atto-forge-api
          mkdir -m 700 "$work/api"
          compiler="$(sha256sum /tmp/atto-forge-api | cut -d' ' -f1)"
          for lane in cold warm edit; do
            /tmp/atto-forge-api "$work/api" "$lane" "$compiler" "$work/api-$lane.s"
            cc /tmp/atto-forge-host.c "$work/api-$lane.s" -o "$work/api-$lane"
            rc=0; "$work/api-$lane" || rc=$?
            if [ "$lane" = edit ]; then test "$rc" = 43; else test "$rc" = 42; fi
            echo "FORGE_API_NATIVE|$lane|$rc"
          done
          cmp "$work/api-cold.s" "$work/api-warm.s"
