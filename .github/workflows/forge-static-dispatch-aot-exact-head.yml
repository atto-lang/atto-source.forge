          for opt in O0 O2; do
            g++ "-$opt" -no-pie \
              "$RUNNER_TEMP/direct-42.s" "$RUNNER_TEMP/driver.cpp" \
              -o "$RUNNER_TEMP/forge-stage0-$opt"
            "$RUNNER_TEMP/forge-stage0-$opt"
            sha256sum "$RUNNER_TEMP/forge-stage0-$opt"
            echo "FORGE_STAGE0_DIRECT_AOT_EXECUTED|opt=$opt|result=42|source_head=$(git rev-parse HEAD)"
          done
      - name: Record strict scope of the AOT receipt
        shell: bash
        run: |
          echo "Forge stage-0 scalar callable direct-native assembly: executed." >> "$GITHUB_STEP_SUMMARY"
          echo "No claim of Forge class/trait/actor dispatch or complete AttoLang feature parity." >> "$GITHUB_STEP_SUMMARY"

      - name: Link and execute real x86_64 AOT call sequence at O0 and O2
        shell: bash
        run: |
          set -euo pipefail
          fixture="$PWD/tests/fixtures/static-dispatch/direct-42.atto"
          binary="$PWD/build-static-dispatch/oresforge_static_dispatch_aot_verifier"
          "$binary" "$fixture" --asm > "$RUNNER_TEMP/direct-42.s"
          grep -Fq '  call .Lores_fn_0' "$RUNNER_TEMP/direct-42.s"
          grep -Fq '  call .Lores_fn_1' "$RUNNER_TEMP/direct-42.s"
          if grep -Eq '^[[:space:]]+(call|jmp)[[:space:]]+\*' "$RUNNER_TEMP/direct-42.s"; then
            echo "Closed Forge direct-call fixture emitted an indirect branch" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/driver.cpp" <<'DRIVER'
          #include <cstdint>
          extern "C" std::int64_t oresforge_entry();
          int main() { return oresforge_entry() == 42 ? 0 : 1; }
          DRIVER
          for opt in O0 O2; do
            g++ "-$opt" -no-pie \
              "$RUNNER_TEMP/direct-42.s" "$RUNNER_TEMP/driver.cpp" \
              -o "$RUNNER_TEMP/forge-stage0-$opt"
            "$RUNNER_TEMP/forge-stage0-$opt"
            sha256sum "$RUNNER_TEMP/forge-stage0-$opt"
            echo "FORGE_STAGE0_DIRECT_AOT_EXECUTED|opt=$opt|result=42|source_head=$(git rev-parse HEAD)"
          done
      - name: Record strict scope of the AOT receipt
        shell: bash
        run: |
          echo "Forge stage-0 scalar callable direct-native assembly: executed." >> "$GITHUB_STEP_SUMMARY"
          echo "No claim of Forge class/trait/actor dispatch or complete AttoLang feature parity." >> "$GITHUB_STEP_SUMMARY"
