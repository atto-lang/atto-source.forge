name: Closed recursive native IR generated guest proof
on:
  pull_request:
    paths:
      - 'include/atto/closed_recursive_stage.hpp'
      - 'include/atto/closed_recursive_source.hpp'
      - 'include/atto/scalar_lexer.hpp'
      - 'tools/forge_scalar.cpp'
      - 'tests/closed_recursive_source_emit.cpp'
      - 'tests/closed_recursive_source_guest.py'
      - 'include/atto/checked_i64.hpp'
      - 'tests/closed_recursive_stage_emit.cpp'
      - 'tests/closed_recursive_stage_guest.sh'
      - 'tests/closed_recursive_pipeline_emit.cpp'
      - 'tests/closed_recursive_pipeline_guest.sh'
      - '.github/workflows/closed-recursive-native-ir.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-guest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and run native emitter/guest controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD^{tree}
          "$CXX" --version
          bash tests/closed_recursive_stage_guest.sh
          bash tests/closed_recursive_pipeline_guest.sh
          cmake -S . -B "$RUNNER_TEMP/forge-recursive-cli" -DCMAKE_CXX_COMPILER="$CXX" -DATTO_FORGE_SANITIZERS=ON
          cmake --build "$RUNNER_TEMP/forge-recursive-cli" --target forge_scalar --parallel 2
          FORGE_SCALAR="$RUNNER_TEMP/forge-recursive-cli/forge_scalar" python3 tests/closed_recursive_source_guest.py
          test -z "$(git status --porcelain --untracked-files=all)"
