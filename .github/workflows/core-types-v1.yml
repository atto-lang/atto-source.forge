name: core/types independent source-level behavior oracle
on:
  pull_request:
    paths:
      - 'core/types.atto'
      - 'compiler/frontend.cpp'
      - 'compiler/call_native.cpp'
      - 'compiler/call_native.hpp'
      - 'verification/core_types_native.py'
      - 'verification/native_call_executable.py'
      - 'tests/core-types-source.test.mjs'
      - 'tests/core-types-matrix-source.test.mjs'
      - 'tests/fixtures/core-types-v1/**'
      - '.github/workflows/core-types-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check exact PR head and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: Run freestanding Atto source oracle and mutation controls
        run: |
          set -euo pipefail
          node --test tests/core-types-source.test.mjs tests/core-types-matrix-source.test.mjs
          echo 'CORE_TYPES_SOURCE_ONLY=PASS'
          echo 'CORE_TYPES_COMPILED_GUEST=NOT_EXECUTED_BY_THIS_JOB'
      - name: Preserve evidence boundary
        if: always()
        run: echo 'This workflow runs a strict source-model oracle only; it neither compiles Atto nor proves NativeAOT/Wasm/JIT guest execution.' >> "$GITHUB_STEP_SUMMARY"
  core-types-native-compiler-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head before native compiler execution
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
      - name: Build Forge compiler and admit unchanged core/types
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B "$RUNNER_TEMP/forge-core-types" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/forge-core-types" --target oresforge --parallel 2
          "$RUNNER_TEMP/forge-core-types/oresforge" check tests/fixtures/core-types-v1/forge-namespace-positive.atto
          test "$("$RUNNER_TEMP/forge-core-types/oresforge" run tests/fixtures/core-types-v1/forge-namespace-positive.atto)" = "64"
          for case in forge-namespace-duplicate-negative forge-namespace-late-negative; do
            if "$RUNNER_TEMP/forge-core-types/oresforge" check "tests/fixtures/core-types-v1/$case.atto" >"$RUNNER_TEMP/$case.stdout" 2>"$RUNNER_TEMP/$case.stderr"; then
              echo "$case unexpectedly compiled" >&2
              exit 1
            fi
            case "$case" in
              *duplicate*) grep -Fq FORGE_NAMESPACE_DUPLICATE "$RUNNER_TEMP/$case.stderr";;
              *late*) grep -Fq FORGE_NAMESPACE_HEADER_ORDER "$RUNNER_TEMP/$case.stderr";;
            esac
          done
          echo 'CORE_TYPES_FORGE_NAMESPACE_FRAGMENT=EXECUTED'
          # This library intentionally has no main; compile the pinned unchanged
          # source plus explicit test entry adapters, link, and run every helper.
          python3 verification/core_types_native.py --compiler "$RUNNER_TEMP/forge-core-types/oresforge"
      - name: Evidence limitations
        if: always()
        run: echo 'Pinned core/types plus test entry adapters: native x86-64 scalar AOT only; imported-module, generic, actor and full-language parity require separate proofs. Zero actual runner steps means NOT_EXECUTED.' >> "$GITHUB_STEP_SUMMARY"
