name: Forge compiler and runtime checks

on:
  push:
    branches: [main, 'test/atto-forge-real-stage0-core-boundary-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          echo "EXACT_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Self-test fail-closed Option-pattern evidence harness (synthetic only)
        run: python3 -m unittest discover -s scripts -p test_option_pattern_contract.py -v
      - name: Reject unsupported Option pattern syntax using real Forge compiler
        run: |
          python3 scripts/check_option_pattern_contract.py --backend forge \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}" --report build/option-pattern-forge.json \
            -- ./build/oresforge ir '{source}'
      - name: Preserve Option-pattern admission report (not parity)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: option-pattern-forge-admission-${{ matrix.compiler }}
          path: build/option-pattern-forge.json
          if-no-files-found: ignore
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure
      - name: Execute stage-0 AttoLang real scalar guest and negative import controls
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_atto_core_stage0_guest.sh ./build/oresforge "$PWD" "${{ matrix.compiler }}" | tee build/atto-forge-stage0.log
          grep -F 'ATTO_FORGE_STAGE0_GUEST_EXECUTED|result=42|module_imports=UNSUPPORTED|native_asm=EMITTED|native_exec=EXECUTED|mutation_result=43|pie=YES|exec_stack=NO' build/atto-forge-stage0.log
          grep -E '^ATTO_FORGE_NATIVE_BINARY_SHA256=[0-9a-f]{64}$' build/atto-forge-stage0.log
          echo "ATTO_FORGE_HEAD=$(git rev-parse HEAD) TREE=$(git rev-parse 'HEAD^{tree}')" > build/atto-forge-stage0-receipt.txt
          for file in examples/atto-core-stage0.atto examples/atto-core-stage0-deny.atto; do
            test "$(git hash-object "$file")" = "$(git rev-parse "HEAD:$file")"
            git hash-object "$file" >> build/atto-forge-stage0-receipt.txt
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atto-forge-stage0-source-bound-${{ matrix.compiler }}
          path: |
            build/atto-forge-stage0.log
            build/atto-forge-stage0-receipt.txt
          if-no-files-found: warn
      - name: Execute compiler-owned Atto Core identity stage-1 native guest and receipts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_atto_core_identity_guest.sh ./build/oresforge "$PWD" "${{ matrix.compiler }}" | tee build/atto-core-identity-stage1.log
          grep -F 'ATTO_FORGE_STAGE1_CORE_IDENTITY_EXECUTED|result=42|mutation_result=43|compiler_owned=YES|native_harness=HOSTED|guest_host_imports=NOT_VERIFIED|pie=YES|exec_stack=NO' build/atto-core-identity-stage1.log
          grep -E '^ATTO_FORGE_STAGE1_NATIVE_BINARY_SHA256=[0-9a-f]{64}$' build/atto-core-identity-stage1.log
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "compiler_sha256=$(sha256sum build/oresforge | cut -d' ' -f1)"
            for source in contracts/atto-core-v1/identity.atto examples/atto-core-identity.atto; do
              test "$(git hash-object --no-filters -- "$source")" = "$(git rev-parse "HEAD:$source")"
              echo "blob:$source=$(git hash-object --no-filters -- "$source")"
            done
          } > build/atto-core-identity-stage1-receipt.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atto-forge-stage1-source-bound-${{ matrix.compiler }}
          path: |
            build/atto-core-identity-stage1.log
            build/atto-core-identity-stage1-receipt.txt
          if-no-files-found: warn
      - name: Execute documented source fixture
        run: test "$(./build/oresforge run examples/hello.ores)" = "14"

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          echo "EXACT_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Compile
        run: cmake --build build-sanitized --parallel 2
      - name: Execute sanitized regressions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          echo "EXACT_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "EXACT_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Configure instrumented libFuzzer
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF -DORESFORGE_FUZZ=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Compile instrumented frontend and actor mailbox fuzz targets
        run: cmake --build build-fuzz --target oresforge_fuzz oresforge_mailbox_fuzz --parallel 2
      - name: Deterministic bounded frontend fuzz corpus regression
        run: >-
          ./build-fuzz/oresforge_fuzz -runs=3000 -max_len=4096
          -timeout=3 -rss_limit_mb=1024 verification/fuzz-corpus
      - name: Differential actor mailbox fuzz regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          ./build-fuzz/oresforge_mailbox_fuzz -runs=3000 -max_len=4096
          -timeout=3 -rss_limit_mb=1024 -seed=20261016

  mailbox-thread-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact Oreslang PR-head checkout (not merge ref)
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
      - name: GCC ThreadSanitizer on actual actor mailbox concurrency
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -pthread -Wall -Wextra -Wconversion -Werror \
            -fno-omit-frame-pointer -fsanitize=thread -I. \
            runtime/actor.cpp verification/actor_mailbox_concurrency.cpp \
            -o "$RUNNER_TEMP/oresforge-mailbox-tsan"
          for i in 1 2 3; do
            TSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/oresforge-mailbox-tsan"
          done
