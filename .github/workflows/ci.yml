name: Forge compiler and runtime checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact-blob actor routing fixture
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure
      - name: Execute documented source fixture
        run: test "$(./build/oresforge run examples/hello.ores)" = "14"

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact-blob actor routing fixture
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Compile
        run: cmake --build build-sanitized --parallel 2
      - name: Execute sanitized regressions
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-sanitized --output-on-failure

  actor-routing-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact-blob actor routing fixture
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Record immutable source identity
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git hash-object runtime/actor_pipeline_policy.hpp verification/actor_pipeline_concurrency_test.cpp
      - name: Compile host selector race test with ThreadSanitizer
        run: >-
          g++ -std=c++20 -O1 -g -pthread -I.
          -Wall -Wextra -Wpedantic -Werror
          -fsanitize=thread -fno-omit-frame-pointer
          verification/actor_pipeline_concurrency_test.cpp
          -o actor-pipeline-tsan
      - name: Prove routing fairness and retirement gate
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./actor-pipeline-tsan

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact-blob actor routing fixture
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Configure instrumented libFuzzer
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=OFF -DORESFORGE_FUZZ=ON
          -DCMAKE_CXX_COMPILER=clang++
      - name: Compile fuzz target and instrumented compiler
        run: cmake --build build-fuzz --target oresforge_fuzz --parallel 2
      - name: Deterministic bounded fuzz corpus regression
        run: >-
          ./build-fuzz/oresforge_fuzz -runs=3000 -max_len=4096
          -timeout=3 -rss_limit_mb=1024 verification/fuzz-corpus
