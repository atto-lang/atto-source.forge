name: Singleton and shared-table runtime slice
# Stage0 compiler/runtime bridge is not a parity promotion.
on:
  pull_request:
    paths:
      - runtime/actor.hpp
      - runtime/actor.cpp
      - runtime/singleton_cell.hpp
      - runtime/singleton_identity.hpp
      - runtime/shared_i64_table.hpp
      - runtime/guest_shared_i64_stage0.hpp
      - verification/singleton_shared_runtime.cpp
      - verification/singleton_admission.cpp
      - verification/singleton_guest_stage0.cpp
      - verification/guest_shared_i64_stage0.cpp
      - verification/actor_execution_lease.cpp
      - CMakeLists.txt
      - codegen/native.cpp
      - compiler/**
      - codegen/native.hpp
      - scripts/test-singleton-shared-runtime.sh
      - .github/workflows/singleton-shared-runtime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        profile: [release, sanitized, sanitized-leaks]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact tested source
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Test host substrate, admission, and stage0 compiler/runtime bridge
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash scripts/test-singleton-shared-runtime.sh "$PROFILE"
