# Source-free runner-admission diagnostic for conformance issue #315.
# This workflow must NOT read, checkout, upload, or relocate private source.
name: Atto Forge source-free runner allocation diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/atto-macro-source-free-runner-canary.yml
      - compiler/call_native.cpp
      - verification/forge_macro_denial.py
  workflow_dispatch:
permissions: {}
jobs:
  runner-allocation-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Prove source-repository runner allocated
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = Linux
          test "${GITHUB_REPOSITORY}" = ores-truffle-oreslang/oreslang-source.forge
          printf 'FORGE_SOURCE_FREE_RUNNER_ALLOCATED run=%s\n' "${GITHUB_RUN_ID}"
      - name: Prove second shell step executed
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}"
          printf 'FORGE_SOURCE_FREE_RUNNER_SECOND_STEP checkout=false source_export=false\n'
