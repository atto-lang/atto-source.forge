name: Forge actor incarnation lifecycle owner host verification
on:
  pull_request:
    paths:
      - 'runtime/ActorIncarnationOwnerV1.hpp'
      - 'runtime/ActorIncarnationMemoryV1.hpp'
      - 'runtime/actor_arena.hpp'
      - 'runtime/MonotonicDomainV1.hpp'
      - 'runtime/TenantIsolationAdmission.hpp'
      - 'verification/mailbox_incarnation_reuse_v1_test.cpp'
      - 'verification/monotonic_domain_v1_test.cpp'
      - 'verification/actor_arena_domain_reuse_v1_test.cpp'
      - 'verification/actor_owner_lifetime_v1_test.cpp'
      - 'runtime/actor.hpp'
      - 'runtime/actor.cpp'
      - 'verification/actor_incarnation_owner_v1_test.cpp'
      - 'verification/actor_incarnation_memory_v1_test.cpp'
      - 'verification/supervisor_data_fence_parity_v1_test.cpp'
      - 'verification/actor_ci_contract.py'
      - 'verification/actor_ci_contract_selftest.py'
      - 'verification/actor_ctest_receipt.py'
      - 'verification/actor_ctest_receipt_selftest.py'
      - 'CMakeLists.txt'
      - '.github/workflows/forge-actor-owner-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        mode: [optimized, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read back exact immutable source identity
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse 'HEAD^{tree}'
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git hash-object verification/supervisor_data_fence_parity_v1_test.cpp)" = 5627b7bcb9852151392485e854d598e763184637
          test "$(git hash-object runtime/ActorIncarnationOwnerV1.hpp)" = 806913d5a5ef1890b7d2bd2030f98fa2a49c74ea
      - name: Compile and execute actor lifecycle host CTest
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 verification/actor_ci_contract.py
          python3 verification/actor_ci_contract_selftest.py
          python3 verification/actor_ctest_receipt_selftest.py
          flags="-O2 -Wall -Wextra -Wpedantic -Werror"
          if [[ "$MODE" == sanitized ]]; then
            flags="-O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          build="$RUNNER_TEMP/actor-owner-$MODE"
          cmake -S . -B "$build" -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_CXX_FLAGS="$flags"
          cmake --build "$build" --target oresforge_actor_incarnation_owner_v1 oresforge_actor_incarnation_memory_v1 oresforge_supervisor_data_fence_parity_v1 oresforge_mailbox_incarnation_reuse_v1 oresforge_monotonic_domain_v1 oresforge_actor_arena_domain_reuse_v1 oresforge_actor_owner_lifetime_v1 --parallel 2
          export ASAN_OPTIONS=detect_leaks=1
          ctest --test-dir "$build" --no-tests=error --output-on-failure -R '^(oresforge_actor_incarnation_(owner|memory)_v1_host|oresforge_supervisor_data_fence_parity_v1_host|oresforge_mailbox_incarnation_reuse_v1_host|oresforge_monotonic_domain_v1_host|oresforge_actor_arena_domain_reuse_v1_host|oresforge_actor_owner_lifetime_v1_host)$' --output-junit "$RUNNER_TEMP/actor-ctest.xml"
          python3 verification/actor_ctest_receipt.py "$RUNNER_TEMP/actor-ctest.xml"
          "$build/oresforge_actor_incarnation_owner_v1" | tee "$RUNNER_TEMP/actor-owner-host.txt"
          grep -Fx 'FORGE_ACTOR_OWNER_HOST_PASS|turn=1|stop_restart=1|sibling=42|guest_atto=0|physical_stack=0' "$RUNNER_TEMP/actor-owner-host.txt"
          "$build/oresforge_actor_incarnation_memory_v1" | tee "$RUNNER_TEMP/actor-memory-host.txt"
          grep -Fx 'FORGE_ACTOR_INCAR_MEMORY_HOST_PASS|private_heap=1|logical_stack=1|guest_atto=0|physical_stack=0' "$RUNNER_TEMP/actor-memory-host.txt"
          "$build/oresforge_supervisor_data_fence_parity_v1" | tee "$RUNNER_TEMP/actor-fence-host.txt"
          grep -E '^FORGE_SUPERVISOR_DATA_FENCE_HOST_PASS\|attempts=6144\|admitted=[0-9]+\|sibling=1\|native_guest=0\|supervision_tree=0$' "$RUNNER_TEMP/actor-fence-host.txt"
          "$build/oresforge_mailbox_incarnation_reuse_v1" | tee "$RUNNER_TEMP/oresforge_mailbox_incarnation_reuse_v1.txt"
          grep -Fx 'PASS FORGE_MAILBOX_REUSE_CYCLES=100000 STALE_AUTHORITY=0 SIBLING=42' "$RUNNER_TEMP/oresforge_mailbox_incarnation_reuse_v1.txt"
          "$build/oresforge_monotonic_domain_v1" | tee "$RUNNER_TEMP/oresforge_monotonic_domain_v1.txt"
          grep -Fx 'PASS DOMAIN_ISSUED=100000 BOUNDARY_ISSUED=64 BOUNDARY_DENIED=960 PERMANENT_DENIALS=100000' "$RUNNER_TEMP/oresforge_monotonic_domain_v1.txt"
          "$build/oresforge_actor_arena_domain_reuse_v1" | tee "$RUNNER_TEMP/oresforge_actor_arena_domain_reuse_v1.txt"
          grep -Fx 'PASS ARENA_REUSE_CYCLES=16384 STALE_DOMAIN_DENIED=1 ACTIVE_RETIRE_DENIED=1 ZEROED=1 SIBLING=42' "$RUNNER_TEMP/oresforge_actor_arena_domain_reuse_v1.txt"
          "$build/oresforge_actor_owner_lifetime_v1" | tee "$RUNNER_TEMP/oresforge_actor_owner_lifetime_v1.txt"
          grep -Fx 'PASS OWNER_RESTART_CYCLES=1000000 SIBLING_STATE=42 BUDGET_LEAK=0' "$RUNNER_TEMP/oresforge_actor_owner_lifetime_v1.txt"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
