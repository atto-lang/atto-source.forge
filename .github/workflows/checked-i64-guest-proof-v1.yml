name: Checked i64 guest proof v1

on:
  pull_request:
    paths:
      - "contracts/parity/v1/checked-i64-42.ores"
      - ".github/workflows/checked-i64-guest-proof-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-assembly-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact source and shared guest bytes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object contracts/parity/v1/checked-i64-42.ores)" = "8e4f76fa1e4752f4996d464cd02a86f609430118"
          git diff --quiet --exit-code HEAD --
      - name: Build exact-head Forge compiler
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/checked-i64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/checked-i64 --target oresforge --parallel 2
          test -x build/checked-i64/oresforge
      - name: Emit, link, and execute native checked-i64 guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/checked-i64-proof
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) target=x86_64 ;;
            aarch64|arm64) target=arm64 ;;
            *) echo "unsupported native host architecture: $arch" >&2; exit 1 ;;
          esac
          build/checked-i64/oresforge emit-asm "$target"             contracts/parity/v1/checked-i64-42.ores             > build/checked-i64-proof/entry.s
          cat > build/checked-i64-proof/driver.c <<'EOF'
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          extern int64_t oresforge_entry(void);
          int main(void) {
            if (printf("%" PRId64 "\n", oresforge_entry()) < 0) return 1;
            return fflush(stdout) == 0 ? 0 : 1;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror             build/checked-i64-proof/driver.c             build/checked-i64-proof/entry.s             -o build/checked-i64-proof/guest
          test "$(build/checked-i64-proof/guest)" = 42
          sha256sum build/checked-i64/oresforge > build/checked-i64-proof/compiler-sha256.txt
          sha256sum build/checked-i64-proof/guest > build/checked-i64-proof/guest-sha256.txt
          sha256sum build/checked-i64-proof/entry.s > build/checked-i64-proof/assembly-sha256.txt
          sha256sum contracts/parity/v1/checked-i64-42.ores > build/checked-i64-proof/source-sha256.txt
          git rev-parse HEAD > build/checked-i64-proof/head-sha.txt
          git rev-parse 'HEAD^{tree}' > build/checked-i64-proof/tree-sha.txt
          printf '%s
' 42 > build/checked-i64-proof/guest-stdout.txt
      - name: Upload native Forge compiler and guest proof receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-i64-guest-forge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/checked-i64-proof/
            build/checked-i64/oresforge
          if-no-files-found: error
          retention-days: 14
