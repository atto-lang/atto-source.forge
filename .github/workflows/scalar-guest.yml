name: Restricted Forge compiled scalar guest
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scalar-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile restricted Atto sources and execute native guests
        run: python -m unittest discover -s tests -p 'test_scalar_compiler.py' -v
