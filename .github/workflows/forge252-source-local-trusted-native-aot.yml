# Manual-only Forge #252 native guest AOT CI on source org's dedicated trusted runner.
# Independent exact-head code review and ephemeral runner group required; NO private export.
name: Forge 252 source-local trusted native AOT (review required)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact current same-repository Forge PR #252 head SHA"
        required: true
        type: string
      expected_tree_sha:
        description: "Exact full source Git root tree SHA of PR #252"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: forge252-source-local-reviewed-native
  cancel-in-progress: false

jobs:
  reviewed-native-gcc-clang:
    if: ${{ github.repository == 'ores-truffle-oreslang/oreslang-source.forge' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    # Administrator must restrict group to source repo and this @main workflow.
    runs-on:
      group: atto-forge-source-local-trusted
      labels: [self-hosted, linux, x64, atto-ci-trusted]
    timeout-minutes: 90
    steps:
      - name: Checkout protected default branch admission tests only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true

      - name: Verify and exercise protected-main admission gate before source PR checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ores-truffle-oreslang/oreslang-source.forge'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 -m unittest discover -s verification -p test_forge252_source_local_trusted_gate.py -v
          echo FORGE252_ADMISSION_NEGATIVE_TESTS=EXECUTED_BEFORE_PR_CHECKOUT

      - name: Authorize exact live PR head, tree and independent privileged review
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree_sha }}
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          REPO = "ores-truffle-oreslang/oreslang-source.forge"
          REPO_ID = 1419703674
          PR = 252
          SHA = os.environ["EXPECTED_HEAD"]
          TREE = os.environ["EXPECTED_TREE"]
          TOKEN = os.environ["READ_ONLY_GITHUB_TOKEN"]
          ASSOCIATIONS = {"OWNER", "MEMBER", "COLLABORATOR"}
          if not (len(SHA) == len(TREE) == 40 and
                  all(c in "0123456789abcdef" for c in SHA + TREE)):
              raise SystemExit("DENIED: malformed immutable source identity")
          def fetch(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "atto-ephemeral-runner-admission"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          pull = fetch("pulls/" + str(PR))
          head = pull.get("head") or {}
          source_repo = head.get("repo") or {}
          base = pull.get("base") or {}
          base_repo = base.get("repo") or {}
          author = (pull.get("user") or {}).get("id")
          if (pull.get("state") != "open" or head.get("sha") != SHA or
                  source_repo.get("full_name") != REPO or
                  source_repo.get("id") != REPO_ID or
                  base.get("ref") != "main" or base_repo.get("id") != REPO_ID or
                  not isinstance(author, int)):
              raise SystemExit("DENIED: source PR identity, branch, or author changed")
          commit = fetch("git/commits/" + SHA)
          if (commit.get("tree") or {}).get("sha") != TREE:
              raise SystemExit("DENIED: expected Git tree is not the live PR commit tree")
          reviews = []
          for page in range(1, 12):
              batch = fetch("pulls/" + str(PR) + "/reviews?per_page=100&page=" + str(page))
              if not isinstance(batch, list) or len(batch) > 100:
                  raise SystemExit("DENIED: invalid GitHub review response")
              reviews.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise SystemExit("DENIED: review pagination exceeds audit limit")
          latest = {}
          for review in reviews:
              user = review.get("user") or {}
              rid, reviewer = user.get("id"), user.get("login")
              state, serial = review.get("state"), review.get("id")
              if (review.get("commit_id") != SHA or user.get("type") != "User" or
                      not isinstance(rid, int) or rid == author or
                      not isinstance(reviewer, str) or not reviewer or
                      not isinstance(serial, int) or
                      review.get("author_association") not in ASSOCIATIONS or
                      state not in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED")):
                  continue
              if rid not in latest or serial > latest[rid][0]:
                  latest[rid] = (serial, state, reviewer)
          if any(row[1] == "CHANGES_REQUESTED" for row in latest.values()):
              raise SystemExit("DENIED: current-head reviewer requested changes")
          approved = []
          for rid, row in latest.items():
              if row[1] != "APPROVED":
                  continue
              reviewer = row[2]
              if not re.fullmatch(r"[A-Za-z0-9-]{1,39}", reviewer):
                  continue
              # Org membership alone does not imply repository write permission.
              # GitHub's metadata-readable collaborator endpoint resolves grants
              # through organizations, teams and custom roles; deny 403/404.
              permission = fetch("collaborators/" + reviewer + "/permission")
              if (permission.get("user") or {}).get("id") != rid or \
                      permission.get("permission") not in ("write", "maintain", "admin"):
                  continue
              approved.append(reviewer)
          if not approved:
              raise SystemExit("DENIED: no independent privileged approval on exact head")
          print("ATTO_SOURCE_LOCAL_REVIEWED_HEAD=" + SHA)
          print("ATTO_SOURCE_LOCAL_TREE=" + TREE)
          print("ATTO_SOURCE_LOCAL_INDEPENDENT_APPROVAL_COUNT=" + str(len(approved)))
          print("ATTO_SOURCE_LOCAL_SOURCE_EXPORT=NONE")
          PY

      - name: Checkout independently approved exact Forge PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false
          clean: true

      - name: Reconfirm immutable source checkout, including Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(uname -m)" = x86_64
          echo "FORGE252_NATIVE_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "FORGE252_NATIVE_SOURCE_TREE=$EXPECTED_TREE"
          echo "FORGE252_RUN=$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"

      - name: Compile complete Forge tree and execute GCC Clang O0 O2 stage-0 guest
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree_sha }}
        run: |
          set -euo pipefail
          fixture="$PWD/tests/fixtures/static-dispatch/direct-42.atto"
          test -s "$fixture"
          for compiler in g++ clang++; do
            if test "$compiler" = g++; then tool=gcc; else tool=clang; fi
            build="build-forge252-$tool"
            cmake -S . -B "$build" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER="$compiler"
            cmake --build "$build" --parallel 2
            count="$(ctest --test-dir "$build" -N -R '^oresforge_static_dispatch_aot_source_and_ir$' |
              awk '/^Total Tests:/ {print $3}')"
            test "$count" = 1
            ctest --test-dir "$build" --output-on-failure --no-tests=error
            ctest --test-dir "$build" --output-on-failure -V --no-tests=error \
              -R '^oresforge_static_dispatch_aot_source_and_ir$'
            binary="$PWD/$build/oresforge_static_dispatch_aot_verifier"
            test -x "$binary"
            "$binary" "$fixture" --asm > "$RUNNER_TEMP/forge252-$tool.s"
            grep -Fq '  call .Lores_fn_0' "$RUNNER_TEMP/forge252-$tool.s"
            grep -Fq '  call .Lores_fn_1' "$RUNNER_TEMP/forge252-$tool.s"
            if grep -Eq '^[[:space:]]+(call|jmp)[[:space:]]+\*' "$RUNNER_TEMP/forge252-$tool.s"; then
              echo 'FAIL: indirect dispatch in closed native-call fixture' >&2
              exit 1
            fi
            cat > "$RUNNER_TEMP/forge252-driver.cpp" <<'DRIVER'
          #include <cstdint>
          extern "C" std::int64_t oresforge_entry();
          int main() { return oresforge_entry() == 42 ? 0 : 1; }
          DRIVER
            for opt in O0 O2; do
              output="$RUNNER_TEMP/forge252-$tool-$opt"
              "$compiler" "-$opt" -no-pie "$RUNNER_TEMP/forge252-$tool.s" \
                "$RUNNER_TEMP/forge252-driver.cpp" -o "$output"
              "$output"
              sha256sum "$output"
              echo "FORGE252_NATIVE_AOT_PASS compiler=$tool opt=$opt value=42 head=$EXPECTED_HEAD tree=$EXPECTED_TREE"
            done
            sha256sum "$binary"
          done

      - name: Recheck live exact head/tree/independent review after native execution
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree_sha }}
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          REPO = "ores-truffle-oreslang/oreslang-source.forge"
          REPO_ID = 1419703674
          PR = 252
          SHA = os.environ["EXPECTED_HEAD"]
          TREE = os.environ["EXPECTED_TREE"]
          TOKEN = os.environ["READ_ONLY_GITHUB_TOKEN"]
          ASSOCIATIONS = {"OWNER", "MEMBER", "COLLABORATOR"}
          if not (len(SHA) == len(TREE) == 40 and
                  all(c in "0123456789abcdef" for c in SHA + TREE)):
              raise SystemExit("DENIED: malformed immutable source identity")
          def fetch(path):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "User-Agent": "atto-ephemeral-runner-admission"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          pull = fetch("pulls/" + str(PR))
          head = pull.get("head") or {}
          source_repo = head.get("repo") or {}
          base = pull.get("base") or {}
          base_repo = base.get("repo") or {}
          author = (pull.get("user") or {}).get("id")
          if (pull.get("state") != "open" or head.get("sha") != SHA or
                  source_repo.get("full_name") != REPO or
                  source_repo.get("id") != REPO_ID or
                  base.get("ref") != "main" or base_repo.get("id") != REPO_ID or
                  not isinstance(author, int)):
              raise SystemExit("DENIED: source PR identity, branch, or author changed")
          commit = fetch("git/commits/" + SHA)
          if (commit.get("tree") or {}).get("sha") != TREE:
              raise SystemExit("DENIED: expected Git tree is not the live PR commit tree")
          reviews = []
          for page in range(1, 12):
              batch = fetch("pulls/" + str(PR) + "/reviews?per_page=100&page=" + str(page))
              if not isinstance(batch, list) or len(batch) > 100:
                  raise SystemExit("DENIED: invalid GitHub review response")
              reviews.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise SystemExit("DENIED: review pagination exceeds audit limit")
          latest = {}
          for review in reviews:
              user = review.get("user") or {}
              rid, reviewer = user.get("id"), user.get("login")
              state, serial = review.get("state"), review.get("id")
              if (review.get("commit_id") != SHA or user.get("type") != "User" or
                      not isinstance(rid, int) or rid == author or
                      not isinstance(reviewer, str) or not reviewer or
                      not isinstance(serial, int) or
                      review.get("author_association") not in ASSOCIATIONS or
                      state not in ("APPROVED", "CHANGES_REQUESTED", "DISMISSED")):
                  continue
              if rid not in latest or serial > latest[rid][0]:
                  latest[rid] = (serial, state, reviewer)
          if any(row[1] == "CHANGES_REQUESTED" for row in latest.values()):
              raise SystemExit("DENIED: current-head reviewer requested changes")
          approved = []
          for rid, row in latest.items():
              if row[1] != "APPROVED":
                  continue
              reviewer = row[2]
              if not re.fullmatch(r"[A-Za-z0-9-]{1,39}", reviewer):
                  continue
              # Org membership alone does not imply repository write permission.
              # GitHub's metadata-readable collaborator endpoint resolves grants
              # through organizations, teams and custom roles; deny 403/404.
              permission = fetch("collaborators/" + reviewer + "/permission")
              if (permission.get("user") or {}).get("id") != rid or \
                      permission.get("permission") not in ("write", "maintain", "admin"):
                  continue
              approved.append(reviewer)
          if not approved:
              raise SystemExit("DENIED: no independent privileged approval on exact head")
          print("ATTO_SOURCE_LOCAL_REVIEWED_HEAD=" + SHA)
          print("ATTO_SOURCE_LOCAL_TREE=" + TREE)
          print("ATTO_SOURCE_LOCAL_INDEPENDENT_APPROVAL_COUNT=" + str(len(approved)))
          print("ATTO_SOURCE_LOCAL_SOURCE_EXPORT=NONE")
          PY
          echo FORGE252_SOURCE_LOCAL_EXECUTION_COMPLETE_SOURCE_EXPORT_NONE
          echo 'Forge stage-0 direct scalar native AOT only, not full actor or generic parity.' >> "$GITHUB_STEP_SUMMARY"
