name: Forge UHL-1 capability refusal (host-only)
on:
  pull_request:
    paths:
      - 'runtime/uhl1_capability_gate.hpp'
      - 'verification/uhl1_capability_gate_test.cpp'
      - '.github/workflows/uhl1-capability-hostonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-negative-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head and record file hashes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD^{tree}
          git hash-object runtime/uhl1_capability_gate.hpp
          git hash-object verification/uhl1_capability_gate_test.cpp
      - name: Compile and execute GCC host-only gate
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -I. verification/uhl1_capability_gate_test.cpp -o /tmp/forge-uhl-gcc
          /tmp/forge-uhl-gcc
      - name: Compile and execute Clang ASan/UBSan host-only gate
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I. verification/uhl1_capability_gate_test.cpp -o /tmp/forge-uhl-clang
          /tmp/forge-uhl-clang
