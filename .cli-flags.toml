# flags-2-env maps the public Oreslang optimization options to this backend's
# environment ABI. The standalone Forge executable also accepts direct flags.
# All optimization modes beyond off fail closed until executable support exists.
[flags.opt-escape]
env = "ORES_OPT_ESCAPE"
aliases = ["opt-escape"]
type = "string"
default = "off"
help = "Allocation optimization: off|safe|verify|speculative (Forge currently supports off only)."

[flags.jit]
env = "ORES_JIT"
aliases = ["jit"]
type = "string"
default = "off"
help = "Executable JIT compilation: on|off (Forge currently supports off only)."

[flags.opt-escape-report]
env = "ORES_OPT_ESCAPE_REPORT"
aliases = ["opt-escape-report"]
type = "bool"
default = "false"
help = "Emit verified allocation decisions (Forge currently rejects true)."
